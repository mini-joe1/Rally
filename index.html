<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rally">
<meta name="theme-color" content="#10161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Table Tennis Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: scoreboard over a centred table-top court, ability bar and keys below. Single deliberate look: a tournament table under hall lights. */
:root {
  color-scheme: dark;
  --hall: #10161c;        /* sports hall floor */
  --table: #1f4f8a;       /* ITTF blue table top */
  --table-deep: #173c6b;
  --line: #f2f5f8;        /* boundary lines */
  --ball: #ff8a2a;        /* orange 40mm ball */
  --shot: #ffe14d;        /* left player's fired balls */
  --shot2: #c38bff;       /* right player's fired balls */
  --muted: #8fa3b8;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --ui: "Chakra Petch", ui-monospace, system-ui, sans-serif;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; }
html, body { height: 100%; touch-action: manipulation; }
body {
  background: radial-gradient(ellipse at 50% 0%, #1c2733 0%, var(--hall) 70%);
  color: var(--line); font-family: var(--ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px; box-sizing: border-box;
  display: flex; justify-content: center;
}
.wrap { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 12px; }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; }
.side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.side.right { align-items: flex-end; text-align: right; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.score { font-family: var(--display); font-size: clamp(34px, 8vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
.mid { text-align: center; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.mid strong { display: block; font-family: var(--display); font-size: 17px; color: var(--ball); letter-spacing: .04em; font-weight: 400; }
.ammo { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); min-height: 18px; flex-wrap: wrap; }
.side.right .ammo { justify-content: flex-end; }
.ammo b { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--line); }
.pips { display: flex; gap: 3px; flex-wrap: wrap; }
.pip { width: 10px; height: 10px; border-radius: 50%; background: var(--shot); box-shadow: 0 0 5px var(--shot); }
.side.right .pip { background: var(--shot2); box-shadow: 0 0 5px var(--shot2); }
.meta { font-size: 12px; letter-spacing: .06em; color: var(--muted); min-height: 16px; }
.meta em { font-style: normal; color: var(--line); }
.bump .pips { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.3); } }
.court {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%;
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 6px #0b1015, 0 24px 60px rgba(0,0,0,.55);
  touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; }
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  justify-content: safe center; gap: 12px; background: rgba(10,20,34,.7); text-align: center; padding: 16px; cursor: default; overflow-y: auto;
}
.overlay h1 { font-family: var(--display); font-size: clamp(24px, 5.5vw, 46px); margin: 0; font-weight: 400; text-wrap: balance; }
.overlay p { margin: 0; color: #cfdbe7; max-width: 54ch; font-size: 14px; line-height: 1.5; }
.overlay .rec { color: var(--shot); font-size: 13px; letter-spacing: .04em; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
button {
  font-family: var(--ui); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 4px; border: 2px solid var(--line); background: transparent; color: var(--line); cursor: pointer;
}
button.primary { background: var(--ball); border-color: var(--ball); color: #1a0e02; padding: 10px 22px; font-size: 15px; }
button:hover:not(:disabled) { filter: brightness(1.12); }
button:focus-visible { outline: 3px solid var(--ball); outline-offset: 3px; }
button[aria-pressed="true"] { background: var(--line); color: var(--hall); }
button:disabled { opacity: .35; cursor: not-allowed; }
.stage { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; grid-template-areas: "court court" "g0 g1"; }
.stage .court { grid-area: court; width: min(100%, var(--court-w, 100%)); justify-self: center; }
.g0 { grid-area: g0; }
.g1 { grid-area: g1; justify-content: flex-end; }
.grp { display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; }
.grp button { font-size: 12px; padding: 7px 10px; border-color: #3a4a5c; }
.grp button span { color: var(--muted); font-weight: 500; margin-left: 4px; }
.g0 button:not(:disabled) { border-color: var(--shot); }
.g1 button:not(:disabled) { border-color: var(--shot2); }
.g0 button[data-act="fire"]:not(:disabled) { background: var(--shot); color: #1d1600; }
.g1 button[data-act="fire"]:not(:disabled) { background: var(--shot2); color: #1a0d2b; }
.g0 button[data-act="fire"]:not(:disabled) span, .g1 button[data-act="fire"]:not(:disabled) span { color: inherit; opacity: .7; }
.rotate-hint { display: none; margin: 0; text-align: center; font-size: 13px; color: var(--shot); letter-spacing: .04em; }
button, .court { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
button { touch-action: manipulation; }

/* Touch devices: no hover cursor, thumb-sized controls, no keyboard help */
@media (pointer: coarse) {
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  .court { cursor: default; }
  .wrap .foot { display: none; }
  .grp button { flex: 1 1 0; min-height: 52px; font-size: 14px; padding: 8px 6px; }
  .g1:not([hidden]) { display: flex; }
}
@media (pointer: coarse) and (orientation: portrait) {
  .rotate-hint { display: block; }
  .stage.solo { grid-template-columns: 1fr; grid-template-areas: "court" "g0"; }
  .grp { flex-wrap: nowrap; }
}

/* Phone held sideways: table fills the height, controls flank it under the thumbs */
@media (pointer: coarse) and (orientation: landscape) and (max-height: 600px) {
  body { padding-block: 6px; }
  .wrap { max-width: none; gap: 6px; }
  .board { gap: 8px; }
  .side { flex-direction: row; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .side.right { flex-direction: row-reverse; }
  .score { font-size: 30px; }
  .label { font-size: 11px; }
  .ammo { min-height: 0; }
  .meta { min-height: 0; flex-basis: 100%; }
  .mid strong { font-size: 14px; }
  .stage { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "gl court gr"; align-items: center; gap: 10px; }
  .meta { flex-basis: auto; }
  .grp { flex-direction: column; flex-wrap: nowrap; width: 96px; }
  .grp button { flex: none; min-height: 58px; }
  .stage.solo .g0 { grid-area: gr; }
  .stage.duo .g0 { grid-area: gl; }
  .stage.duo .g1 { grid-area: gr; }
  .overlay { gap: 6px; padding-block: 8px; }
  .overlay h1 { font-size: 20px; }
  .overlay p { font-size: 12px; }
  .overlay:not(.msg) #ovText { display: none; }
  .overlay .btns { gap: 6px; }
  .overlay button { font-size: 12px; padding: 6px 10px; }
  .overlay button.primary { padding: 8px 18px; }
}
.sizer { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.sizer button { width: 40px; padding: 8px 0; font-size: 18px; line-height: 1; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; line-height: 1.8; }
.foot button { font-size: 11px; padding: 5px 10px; border-color: #3a4a5c; }
kbd { font-family: var(--ui); border: 1px solid #3a4a5c; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--line); }
@media (prefers-reduced-motion: reduce) { .bump .pips { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="board">
    <div class="side" id="side0">
      <span class="label" id="n0">You</span><span class="score" id="s0">0</span>
      <div class="ammo" id="a0"><b id="c0">0</b><span id="t0">balls</span><span class="pips" id="p0"></span></div>
      <div class="meta" id="m0"></div>
    </div>
    <div class="mid"><strong id="status">First to 21</strong><span id="serve">Win by 2</span></div>
    <div class="side right" id="side1">
      <span class="label" id="n1">CPU</span><span class="score" id="s1">0</span>
      <div class="ammo" id="a1"><span class="pips" id="p1"></span><span id="t1">balls</span><b id="c1">0</b></div>
      <div class="meta" id="m1"></div>
    </div>
  </div>

  <p class="rotate-hint">Turn your phone sideways for a bigger table</p>
  <div class="stage solo" id="stage">
  <div class="court" id="court">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ovTitle">Table Tennis Rally</h1>
      <p id="ovText">Every point banks two balls to fire. Spend them on shots, a goal-line wall or an unstoppable fireball. Score with a fired ball to grow your paddle. Concede and it shrinks.</p>
      <p class="rec" id="rec" hidden></p>
      <div class="btns" id="mode" role="group" aria-label="Mode">
        <button type="button" id="m-cpu" data-m="cpu" aria-pressed="true">vs CPU</button>
        <button type="button" id="m-survival" data-m="survival">Survival</button>
        <button type="button" id="m-duo" data-m="duo">2 Players</button>
      </div>
      <div class="btns" id="len" role="group" aria-label="Match length">
        <button type="button" id="l-11" data-l="11">Short · 11</button>
        <button type="button" id="l-21" data-l="21" aria-pressed="true">Standard · 21</button>
        <button type="button" id="l-31" data-l="31">Long · 31</button>
      </div>
      <div class="btns" id="diff" role="group" aria-label="Difficulty">
        <button type="button" id="d-easy" data-d="easy">Easy</button>
        <button type="button" id="d-normal" data-d="normal" aria-pressed="true">Normal</button>
        <button type="button" id="d-hard" data-d="hard">Hard</button>
      </div>
      <div class="btns">
        <button type="button" class="primary" id="go">Serve</button>
        <button type="button" id="mute" aria-pressed="false">Sound on</button>
        <span class="sizer" role="group" aria-label="Table size">
          <button type="button" id="size-down" aria-label="Smaller table">−</button>
          <span id="size-label">Table 100%</span>
          <button type="button" id="size-up" aria-label="Bigger table">+</button>
        </span>
      </div>
    </div>
  </div>

    <div class="grp g0" id="g0">
      <button type="button" id="b0-fire" data-act="fire" data-side="0">Fire<span>1</span></button>
      <button type="button" id="b0-wall" data-act="wall" data-side="0">Wall<span>3</span></button>
      <button type="button" id="b0-fireball" data-act="fireball" data-side="0">Fireball<span>5</span></button>
    </div>
    <div class="grp g1" id="g1" hidden>
      <button type="button" id="b1-fire" data-act="fire" data-side="1">Fire<span>1</span></button>
      <button type="button" id="b1-wall" data-act="wall" data-side="1">Wall<span>3</span></button>
      <button type="button" id="b1-fireball" data-act="fireball" data-side="1">Fireball<span>5</span></button>
    </div>
  </div>

  <div class="foot">
    <span id="keys"></span>
  </div>
</div>

<script>
(() => {
  const W = 1280, H = 720;
  const PW = 16, PH = 120, BALL = 14, SHOT_SPEED = 760, FIRE_SPEED = 900;
  const PER_POINT = 2, GROW = 24, MAX_PH = 300, WALL_COST = 3, FIRE_COST = 5, RALLY_BONUS = 10, LIVES = 5, MAX_PIPS = 16;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d'), court = $('court'), overlay = $('overlay');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COL = { table: css('--table'), deep: css('--table-deep'), line: css('--line'), ball: css('--ball'), shot: [css('--shot'), css('--shot2')] };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DIFF = {
    easy:   { cpuSpeed: 380, react: 0.55, error: 70, start: 420, fire: [3.5, 6.5], shield: 16 },
    normal: { cpuSpeed: 520, react: 0.75, error: 40, start: 480, fire: [2.2, 4.5], shield: 11 },
    hard:   { cpuSpeed: 720, react: 0.92, error: 18, start: 550, fire: [1.2, 3.0], shield: 7 },
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('pp-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('pp-' + k, JSON.stringify(v)); } catch (e) {} },
  };
  let diff = DIFF[store.get('diff', 'normal')] ? store.get('diff', 'normal') : 'normal';
  let mode = ['cpu', 'survival', 'duo'].includes(store.get('mode', 'cpu')) ? store.get('mode', 'cpu') : 'cpu';
  let records = Object.assign({ rally: 0, margin: 0, survival: 0 }, store.get('records', {}));
  let muted = !!store.get('muted', false);
  let target = [11, 21, 31].includes(store.get('target', 21)) ? store.get('target', 21) : 21;

  // ---------- sound (synthesised, starts after first interaction) ----------
  let ac = null, master = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // iOS only unlocks audio once something plays inside a touch, so play a silent blip
        const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
      } catch (e) { ac = null; }
    }
    if (ac && ac.state !== 'running') ac.resume().catch(() => {});
  }
  addEventListener('touchend', audio, { passive: true });
  // iPhone: stop quick repeated taps and pinches from zooming the page
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < 350 && !e.target.closest('.overlay button')) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  ['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  function tone(f, dur, type = 'sine', vol = 0.2, slide = null, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, f0, f1, q = 1, vol = 0.2, delay = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay, s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  const sfx = {
    pock: i => { tone(i ? 640 : 820, 0.07, 'sine', 0.35); noise(0.03, 3200, 2800, 1, 0.15); },
    bounce: () => tone(1100, 0.04, 'sine', 0.08),
    whoosh: () => noise(0.28, 500, 3000, 2, 0.28),
    fireball: () => { noise(0.55, 180, 1400, 0.8, 0.4); tone(130, 0.45, 'sawtooth', 0.1, 55); },
    cheer: () => { noise(0.9, 1300, 1900, 0.6, 0.22); [523, 659, 784].forEach((f, k) => tone(f, 0.35, 'triangle', 0.14, null, k * 0.08)); },
    lose: () => tone(330, 0.4, 'triangle', 0.2, 160),
    zap: () => tone(900, 0.22, 'square', 0.07, 180),
    thud: () => { tone(90, 0.22, 'sine', 0.5, 45); noise(0.1, 700, 250, 1, 0.25); },
    chime: () => { tone(1200, 0.12, 'sine', 0.2); tone(1600, 0.16, 'sine', 0.2, null, 0.08); },
    freeze: () => tone(2000, 0.35, 'sine', 0.12, 2800),
    grow: () => [440, 554, 659, 880].forEach((f, k) => tone(f, 0.14, 'square', 0.05, null, k * 0.05)),
    shrink: () => tone(500, 0.3, 'square', 0.05, 200),
  };

  // ---------- state ----------
  const mkSide = i => ({ i, x: i ? W - 40 - PW : 40, y: H/2 - PH/2, h: PH, targetH: PH, ammo: 0, score: 0,
    wall: false, frozen: 0, glow: 0, ptrY: null, fireCd: 3 });
  let S = [mkSide(0), mkSide(1)];
  let balls = [], parts = [], floats = [], pickup = null, pickupTimer = 6;
  let state = 'menu', server = 0, serveTimer = 0, rally = 0, slowT = 0, shake = 0;
  let shieldT = 0, shieldCd = 6, keys = {}, lastT = 0;
  const isCPU = () => mode !== 'duo';
  const names = () => mode === 'duo' ? ['Player 1', 'Player 2'] : ['You', 'CPU'];

  function params() {
    const d = Object.assign({}, DIFF[diff]);
    if (mode === 'survival') {
      const n = S[0].score;
      d.cpuSpeed = Math.min(1150, d.cpuSpeed * (1 + 0.07 * n));
      d.react = Math.min(0.97, d.react + 0.02 * n);
      d.error = Math.max(6, d.error * Math.pow(0.94, n));
      d.start = d.start * Math.min(1.5, 1 + 0.03 * n);
      d.fire = d.fire.map(v => Math.max(0.6, v * Math.pow(0.95, n)));
      d.shield = Math.max(4, d.shield * Math.pow(0.95, n));
    }
    return d;
  }

  // ---------- HUD ----------
  function updateHUD(bumpSide) {
    const nm = names();
    S.forEach((s, i) => {
      $('n' + i).textContent = nm[i];
      $('s' + i).textContent = s.score;
      $('c' + i).textContent = s.ammo;
      $('t' + i).textContent = s.ammo === 1 ? 'ball' : 'balls';
      $('p' + i).innerHTML = '<span class="pip"></span>'.repeat(Math.min(s.ammo, MAX_PIPS)) + (s.ammo > MAX_PIPS ? '+' : '');
      const bits = [];
      const pct = Math.round(s.targetH / PH * 100);
      if (pct !== 100) bits.push(`Paddle <em>${pct}%</em>`);
      if (s.wall) bits.push('<em>Wall up</em>');
      $('m' + i).innerHTML = bits.join(' · ');
      $(`b${i}-fire`).disabled = state !== 'play' || s.ammo < 1;
      $(`b${i}-wall`).disabled = state !== 'play' || s.ammo < WALL_COST || s.wall;
      $(`b${i}-fireball`).disabled = state !== 'play' || s.ammo < FIRE_COST;
    });
    if (bumpSide !== undefined) { const el = $('a' + bumpSide); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    if (mode === 'survival') $('status').textContent = `${LIVES - S[1].score} ${LIVES - S[1].score === 1 ? 'life' : 'lives'} left`;
  }
  function setKeysHelp() {
    $('keys').innerHTML = mode === 'duo'
      ? 'P1: <kbd>W</kbd><kbd>S</kbd> move, <kbd>F</kbd> fire, <kbd>Q</kbd> wall, <kbd>E</kbd> fireball · P2: <kbd>↑</kbd><kbd>↓</kbd> move, <kbd>/</kbd> fire, <kbd>.</kbd> wall, <kbd>,</kbd> fireball · <kbd>P</kbd> pause'
      : 'Move with the mouse, <kbd>W</kbd><kbd>S</kbd> or arrows · <kbd>Click</kbd>/<kbd>F</kbd> fire · <kbd>Right-click</kbd>/<kbd>Q</kbd> wall · <kbd>E</kbd> fireball · <kbd>P</kbd> pause';
    $('g1').hidden = mode !== 'duo';
    $('stage').className = 'stage ' + (mode === 'duo' ? 'duo' : 'solo');
    queueFit();
    $('diff').hidden = mode === 'duo';
    $('len').hidden = mode === 'survival';
  }
  function showRecords() {
    const r = records, bits = [];
    if (r.rally) bits.push(`Longest rally ${r.rally}`);
    if (r.margin) bits.push(`Biggest win vs CPU +${r.margin}`);
    if (r.survival) bits.push(`Survival best ${r.survival}`);
    $('rec').textContent = bits.join(' · ');
    $('rec').hidden = !bits.length;
  }
  function setGroup(id, attr, val) {
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === val));
  }
  function setMode(m) { mode = m; store.set('mode', m); setGroup('mode', 'm', m); setKeysHelp(); updateHUD(); describeMode(); }

  }
  function drawBall(b) {
    const c = b.kind === 'fire' ? COL.ball : b.kind === 'shot' ? COL.shot[b.owner] : COL.ball;
    b.trail.forEach((t, k) => {
      const f = (k + 1) / b.trail.length;
      ctx.globalAlpha = f * (b.kind === 'rally' ? 0.25 : 0.5);
      ctx.fillStyle = b.kind === 'fire' ? (k % 2 ? '#ffd23f' : '#ff3b1f') : c;
      const r = b.kind === 'fire' ? BALL * 0.9 * f : BALL/2 * (k / b.trail.length);
      ctx.beginPath(); ctx.arc(t.x + BALL/2 + (b.kind === 'fire' ? (Math.random() - 0.5) * 6 : 0), t.y + BALL/2, r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(b.x + BALL/2 + 5, b.y + BALL/2 + 7, BALL/2, BALL/2.6, 0, 0, Math.PI*2); ctx.fill();
    if (b.kind !== 'rally') { ctx.shadowColor = b.kind === 'fire' ? '#ff3b1f' : c; ctx.shadowBlur = b.kind === 'fire' ? 26 : 14; }
    const r = b.kind === 'fire' ? BALL/2 + 4 : BALL/2 + 1;
    ctx.fillStyle = b.kind === 'fire' ? '#ff5a1f' : c;
    ctx.beginPath(); ctx.arc(b.x + BALL/2, b.y + BALL/2, r, 0, Math.PI*2); ctx.fill();
    if (b.kind === 'fire') { ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(b.x + BALL/2, b.y + BALL/2, r * 0.5, 0, Math.PI*2); ctx.fill(); }
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(b.x + BALL/2 - 2.5, b.y + BALL/2 - 2.5, 2.5, 0, Math.PI*2); ctx.fill();
    if (b.curve) { ctx.strokeStyle = '#7dffb0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x + BALL/2, b.y + BALL/2, r + 5, 0, Math.PI * 1.3); ctx.stroke(); }
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, COL.table); g.addColorStop(1, COL.deep);
    ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.strokeStyle = COL.line; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8);
    ctx.lineWidth = 3; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(10,16,22,.55)'; ctx.fillRect(W/2 - 5, 0, 10, H);
    ctx.fillStyle = COL.line;
    for (let y = 0; y < H; y += 18) ctx.fillRect(W/2 - 2, y, 4, 9);

    // goal-line walls
    S.forEach(s => {
      if (!s.wall) return;
      const x = s.i ? W - 10 : 2;
      ctx.shadowColor = COL.shot[s.i]; ctx.shadowBlur = 18; ctx.fillStyle = COL.shot[s.i];
      ctx.globalAlpha = 0.8 + Math.sin(performance.now() / 150) * 0.15;
      ctx.fillRect(x, 0, 8, H); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    });
    // CPU shield
    if (isCPU() && shieldT > 0) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(performance.now() / 60);
      ctx.fillStyle = COL.shot[1]; ctx.fillRect(W - 30, 0, 10, H);
      ctx.strokeStyle = COL.shot[1]; ctx.lineWidth = 2; ctx.globalAlpha = 0.8;
      for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(W - 30, y); ctx.lineTo(W - 20, y + 15); ctx.lineTo(W - 30, y + 30); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    // pickup
    if (pickup) {
      const pk = PICKUPS[pickup.type], pulse = 1 + Math.sin(pickup.t * 6) * 0.08;
      const fade = pickup.life < 2 ? (Math.sin(pickup.t * 20) > 0 ? 1 : 0.35) : 1;
      ctx.globalAlpha = fade;
      ctx.strokeStyle = pk.color; ctx.lineWidth = 4; ctx.shadowColor = pk.color; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(pickup.x, pickup.y, 22 * pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(10,20,34,.6)';
      ctx.beginPath(); ctx.arc(pickup.x, pickup.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pk.color; ctx.font = '700 15px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText({ slow: '½×', curve: '~', split: '×3', freeze: '❄' }[pickup.type], pickup.x, pickup.y + 1);
      ctx.font = '700 13px "Chakra Petch", monospace'; ctx.fillText(pk.label, pickup.x, pickup.y + 40);
      ctx.globalAlpha = 1;
    }
    S.forEach(drawPaddle);
    balls.forEach(drawBall);
    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    // slow-motion tint
    if (slowT > 0) { ctx.fillStyle = `rgba(120,190,255,${Math.min(0.16, slowT * 0.06)})`; ctx.fillRect(0, 0, W, H); }
    // rally counter
    if ((state === 'play' || state === 'paused') && rally >= 2) {
      ctx.font = '400 28px Bungee, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(10,16,22,.45)'; ctx.fillText(`RALLY ${rally}`, W/2 + 2, 24);
      ctx.fillStyle = rally % RALLY_BONUS >= RALLY_BONUS - 2 ? COL.shot[0] : COL.line;
      ctx.fillText(`RALLY ${rally}`, W/2, 22);
    }
    // floating text
    ctx.font = '700 24px "Chakra Petch", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = Math.min(1, f.life * 1.5);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(f.text, f.x + 2, f.y + 2);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- loop ----------
  const demo = makeBall(W/2, H/2, 420, 260, 'rally', 0);
  function loop(t) {
    const dt = Math.min(0.033, (t - lastT) / 1000 || 0); lastT = t;
    if (state === 'play') update(dt);
    else if (state === 'menu') {
      balls = [demo];
      S[1].y += ((demo.y - PH/2) - S[1].y) * 0.08; S[0].y += ((demo.y - PH/2) - S[0].y) * 0.08;
      demo.x += demo.vx * dt; demo.y += demo.vy * dt;
      if (demo.y < 0 || demo.y > H - BALL) demo.vy *= -1;
      if (demo.x < S[0].x + PW) { demo.x = S[0].x + PW; demo.vx = Math.abs(demo.vx); }
      if (demo.x > S[1].x - BALL) { demo.x = S[1].x - BALL; demo.vx = -Math.abs(demo.vx); }
    }
    if (state !== 'paused') updateFx(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // Shrink the table until the whole game fits the space it's given (e.g. under the Claude header)
  let fitQueued = false;
  let tableScale = Math.min(1, Math.max(0.5, +store.get('scale', 1) || 1));
  function setScale(v) {
    tableScale = Math.round(Math.min(1, Math.max(0.5, v)) * 10) / 10;
    store.set('scale', tableScale);
    $('size-label').textContent = `Table ${Math.round(tableScale * 100)}%`;
    $('size-down').disabled = tableScale <= 0.5; $('size-up').disabled = tableScale >= 1;
    queueFit();
  }
  $('size-down').addEventListener('click', () => setScale(tableScale - 0.1));
  $('size-up').addEventListener('click', () => setScale(tableScale + 0.1));
  function fit() {
    fitQueued = false;
    const root = document.documentElement, court = $('court');
    root.style.setProperty('--court-w', '100%');
    const full = court.getBoundingClientRect();
    const other = root.scrollHeight - full.height;
    let avail = window.innerHeight;
    // Inside Claude's page on a phone, the frame can be taller than what's actually visible
    // (the header pushes it down), so cap it by the phone's real screen height.
    let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
    if (framed && matchMedia('(pointer: coarse)').matches) {
      const short = Math.min(screen.width, screen.height), long = Math.max(screen.width, screen.height);
      const landscape = window.innerWidth > window.innerHeight;
      avail = Math.min(avail, (landscape ? short : long) - (landscape ? 100 : 150));
    }
    const room = Math.max(120, avail - other - 2) * tableScale;
    const w = room * 16 / 9;
    if (w < full.width) root.style.setProperty('--court-w', Math.floor(w) + 'px');
  }
  function queueFit() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fit); } }
  addEventListener('resize', queueFit);
  addEventListener('orientationchange', () => { queueFit(); setTimeout(queueFit, 300); });
  if (window.visualViewport) visualViewport.addEventListener('resize', queueFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);
  if (window.ResizeObserver) new ResizeObserver(queueFit).observe(document.querySelector('.board'));

  setDiff(diff); setLen(target); setMode(mode); showRecords(); setScale(tableScale); fit();
  $('mute').textContent = muted ? 'Sound off' : 'Sound on'; $('mute').setAttribute('aria-pressed', muted);
  requestAnimationFrame(loop);
})();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
